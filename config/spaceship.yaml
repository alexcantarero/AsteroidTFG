behaviors:
  testingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 1280
      learning_rate: 0.0003
      beta: 0.001
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 8
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple
      reward_signals:
        extrinsic:
          gamma: 0.99
          strength: 1.0
        gail:
          gamma: 0.99
          strength: 0.5
          demo_path: demo200326/demo1.demo
    behavioral_cloning:
      strength: 0.5
      demo_path: demo200326/demo1.demo
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 10000
    threaded: true
